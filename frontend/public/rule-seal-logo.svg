<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RuleSeal - Evidence Dossier and Immutable Regulatory Seal">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0f1d38"/>
      <stop offset="100%" stop-color="#15284f"/>
    </linearGradient>

    <linearGradient id="dossierGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="sealOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="sealInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <linearGradient id="ribbonLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="ribbonRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#fbbf24" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background tile with smooth rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="url(#accentCyan)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Evidence Dossier Folder / Folio Backplate -->
  <g transform="translate(68, 56)">
    <!-- Dossier tab -->
    <path d="M 28 32 L 140 32 L 168 56 L 348 56 C 364 56 376 68 376 84 L 376 348 C 376 364 364 376 348 376 L 28 376 C 12 376 0 364 0 348 L 0 60 C 0 44 12 32 28 32 Z"
          fill="url(#dossierGrad)" stroke="#334155" stroke-width="3"/>

    <!-- Folio Interior Document Sheet -->
    <rect x="28" y="72" width="320" height="280" rx="8" fill="url(#paperGrad)" opacity="0.95"/>

    <!-- Document Rule Lines (Representing Regulatory Text & eCFR Citations) -->
    <line x1="56" y1="104" x2="220" y2="104" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="56" y1="126" x2="292" y2="126" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="56" y1="146" x2="280" y2="146" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="56" y1="166" x2="260" y2="166" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="56" y1="186" x2="290" y2="186" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="56" y1="206" x2="180" y2="206" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="56" y1="226" x2="160" y2="226" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

    <!-- Red / Gold Regulatory Evidence Stitch Bar -->
    <rect x="28" y="72" width="8" height="280" rx="4" fill="#0284c7" opacity="0.8"/>
  </g>

  <!-- Dossier Front Pocket Flap Angled Cut -->
  <path d="M 68 280 L 190 280 L 260 340 L 444 340 C 444 370 424 400 396 404 L 96 404 C 80 404 68 392 68 376 Z"
        fill="#1e293b" opacity="0.85" stroke="#334155" stroke-width="2"/>

  <!-- Immutable Regulatory Seal (Wax / Medallion with Ribbon) -->
  <g transform="translate(256, 296)" filter="url(#sealShadow)">
    <!-- Seal Ribbon Tails -->
    <path d="M -36 50 L -64 140 L -24 122 L 8 144 L -6 56 Z" fill="url(#ribbonLeft)"/>
    <path d="M 36 50 L 64 140 L 24 122 L -8 144 L 6 56 Z" fill="url(#ribbonRight)"/>

    <!-- Outer Medallion Star / Teeth (24-point star-seal) -->
    <circle cx="0" cy="0" r="96" fill="url(#sealOuterGrad)"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="6 3"/>

    <!-- Outer Beveled Rim -->
    <circle cx="0" cy="0" r="82" fill="#d97706"/>
    <circle cx="0" cy="0" r="76" fill="url(#sealInnerGrad)" filter="url(#softGlow)"/>

    <!-- Inner Security Border / Concentric Guilloche Ticks -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Central Immutable Lock & Verification Compass -->
    <!-- Lock Body -->
    <rect x="-26" y="-8" width="52" height="42" rx="8" fill="#78350f" stroke="#fff" stroke-width="2"/>
    <!-- Lock Shackle -->
    <path d="M -16 -8 L -16 -24 C -16 -34 16 -34 16 -24 L 16 -8" fill="none" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>
    <path d="M -16 -8 L -16 -24 C -16 -32 16 -32 16 -24 L 16 -8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

    <!-- Lock Keyhole / Verification Check -->
    <circle cx="0" cy="8" r="5" fill="#fde68a"/>
    <polygon points="-2,11 2,11 3,22 -3,22" fill="#fde68a"/>

    <!-- Inscribed Arc / Seal Verification Crest -->
    <path d="M -44 -44 L 0 -58 L 44 -44" fill="none" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-58" r="4" fill="#92400e"/>
    <circle cx="-44" cy="-44" r="3" fill="#92400e"/>
    <circle cx="44" cy="-44" r="3" fill="#92400e"/>

    <!-- Four Guard Points (Representing Multi-Validator Consensus) -->
    <circle cx="-56" cy="0" r="3" fill="#b45309"/>
    <circle cx="56" cy="0" r="3" fill="#b45309"/>
    <circle cx="0" cy="56" r="3" fill="#b45309"/>
  </g>
</svg>
